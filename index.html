<style>
  :root {
    --bg:#070b0e; --card:#0d1721; --border:#16242f;
    --green:#16DC76; --green-soft:rgba(22,220,118,.09);
    --text:#eef4f2; --muted:#8fa3ad; --faint:#5c6e78;
    --fill-0:#eef4f2; --fill-1:#16DC76;
    --font:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius:14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#eef3f1; --card:#ffffff; --border:#dbe5e1;
      --green:#0eaf62; --green-soft:rgba(14,175,98,.10);
      --text:#15221c; --muted:#54655f; --faint:#84948e;
      --fill-0:#15221c; --fill-1:#0eaf62;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem;
    background:var(--bg); color:var(--text);
    font-family:var(--font); font-size:16px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .card {
    width:100%; max-width:25rem; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:2.5rem 2rem; text-align:center;
  }
  .logo { width:116px; height:auto; display:block; margin:0 auto 1.75rem; }
  h1 { font-size:1.05rem; font-weight:600; margin:0 0 .35rem; letter-spacing:-.01em; }
  p { color:var(--muted); font-size:.875rem; margin:0; }
  .pill {
    display:inline-flex; align-items:center; gap:.45rem; margin-top:1.75rem;
    background:var(--green-soft); color:var(--green); border-radius:999px;
    padding:.35rem .75rem; font-size:.74rem; font-weight:600;
    letter-spacing:.02em;
  }
  .dot { width:.4rem; height:.4rem; border-radius:50%; background:var(--green); }
  .note { margin-top:1.75rem; padding-top:1.25rem; border-top:1px solid var(--border);
          font-size:.76rem; color:var(--faint); }
</style>
</head>
